application.properties

server.port=8080

# ── Banco de dados (MySQL) — cadastro/login de usuários ──
spring.application.name=financas
spring.datasource.url=jdbc:mysql://localhost:3306/financas
spring.datasource.username=financas_app
spring.datasource.password=SENHA_DE_USUARIO_ROOT_MYSQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Configuração SMTP (exemplo usando Gmail) ──
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=SEU_EMAIL
spring.mail.password=SUA_SENHA_CONTA_GOOGLE_APP_SENHA
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# E-mail que aparece como remetente (geralmente igual ao spring.mail.username)
mail.remetente= SEU_EMAIL
mail.remetente.nome=Finance



